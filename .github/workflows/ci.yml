name: CI

on:
  push:
    branches:
      - main
      - test
      - development

  pull_request:
    branches:
      - main
      - test

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      # --------------------
      # Checkout UI Repo
      # --------------------
      - name: Checkout UI
        uses: actions/checkout@v4

      # --------------------
      # Checkout API Repo
      # --------------------
      - name: Checkout API Repo
        uses: actions/checkout@v4
        with:
          repository: mansur61/HerkesYazarOlsun.Servis
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: HerkesYazarOlsun.Servis

      # --------------------
      # Setup .NET
      # --------------------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # - run: dotnet restore
      # - run: dotnet build -c Release --no-restore
      # - run: dotnet test -c Release --no-build
      
      - run: dotnet restore HerkesYazarOlsun.Portal/HerkesYazarOlsun.Portal.csproj
      - run: dotnet build HerkesYazarOlsun.Portal/HerkesYazarOlsun.Portal.csproj -c Release --no-restore
      - run: dotnet test HerkesYazarOlsun.Portal/HerkesYazarOlsun.Portal.csproj -c Release --no-build


      # --------------------
      # Publish
      # --------------------
      - name: Publish
        if: github.ref_name == 'test' || github.ref_name == 'main'
        # run: dotnet publish -c Release -o publish
        run: dotnet publish HerkesYazarOlsun.Portal/HerkesYazarOlsun.Portal.csproj -c Release -o publish

      # --------------------
      # Backup CURRENT → PREV (TEST)
      # --------------------
      - name: Backup TEST
        if: github.ref_name == 'test'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: /
          server-dir: /test.herkesyazarolsun.com.tr/prev/
          dangerous-clean-slate: true

      # --------------------
      # Deploy TEST → CURRENT
      # --------------------
      - name: Deploy TEST
        if: github.ref_name == 'test'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: publish/
          server-dir: /test.herkesyazarolsun.com.tr/current/

      # --------------------
      # Health Check TEST
      # --------------------
      - name: Health Check TEST
        if: github.ref_name == 'test'
        run: |
          curl -f https://test.herkesyazarolsun.com.tr/health

      # ====================
      # PROD
      # ====================

      - name: Backup PROD
        if: github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: /
          server-dir: /httpdocs/prev/
          dangerous-clean-slate: true

      - name: Deploy PROD
        if: github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: publish/
          server-dir: /httpdocs/current/

      - name: Health Check PROD
        if: github.ref_name == 'main'
        run: |
          curl -f https://herkesyazarolsun.com.tr/health
